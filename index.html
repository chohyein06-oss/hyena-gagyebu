<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4F2FC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="혠아 가계부">
<meta name="application-name" content="혠아 가계부">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>혠아 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4F2FC;--paper:#FFFFFF;--ink:#14324A;--muted:#557189;--line:#C7E0F2;
  --good:#1F8A5B;--warn:#B57C05;--bad:#C8323F;--accent:#1A73B5;--chip:#D5EAF8;--track:#CDE4F5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A26;--paper:#16283A;--ink:#E4F1FB;--muted:#93AEC4;--line:#24405A;
    --good:#3DBB83;--warn:#E7B53A;--bad:#F06371;--accent:#7CC4F2;--chip:#1E3650;--track:#22405C;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A26;--paper:#16283A;--ink:#E4F1FB;--muted:#93AEC4;--line:#24405A;
  --good:#3DBB83;--warn:#E7B53A;--bad:#F06371;--accent:#7CC4F2;--chip:#1E3650;--track:#22405C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 48px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
header h1{font-size:15px;font-weight:500;color:var(--muted);margin:0}
.mnav{display:flex;align-items:center;gap:4px}
.mnav button{background:none;border:0;width:36px;height:36px;border-radius:50%;font-size:20px;color:var(--muted)}
.mnav button:hover{background:var(--chip)}
.mnav span{font-weight:700;font-size:17px;min-width:110px;text-align:center}

.hero{background:var(--paper);border-radius:20px;padding:22px 20px 18px;border:1px solid var(--line)}
.hero .lbl{font-size:14px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.status{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;border:1.5px solid currentColor}
.big{font-size:44px;font-weight:700;letter-spacing:-1.5px;line-height:1.1;margin:6px 0 14px}
.big small{font-size:22px;font-weight:500;margin-left:2px}
.gauge{height:14px;background:var(--track);border-radius:99px;overflow:hidden}
.gauge i{display:block;height:100%;border-radius:99px;transition:width .4s ease}
.rows{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.row{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;color:var(--muted)}
.row b{color:var(--ink);font-weight:500}
.daily{margin-top:12px;font-size:15px;background:var(--chip);border-radius:12px;padding:10px 12px}
.daily b{font-weight:700}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.budgetedit{display:flex;gap:8px;margin-top:12px}

.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 20px}
.sum div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.sum span{display:block;font-size:12px;color:var(--muted)}
.sum b{font-size:15px;font-weight:700}

.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px}
.card h2{font-size:16px;margin:0 0 12px;font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:none;padding:8px;border-radius:9px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(20,50,74,.15)}
.amt{display:flex;align-items:baseline;border-bottom:2px solid var(--line);margin-bottom:14px}
.amt:focus-within{border-color:var(--accent)}
.amt input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:30px;font-weight:700;padding:4px 0;outline:none}
.amt span{font-size:18px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 12px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.field{display:flex;gap:8px;margin-bottom:12px}
input.t{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px}
.actions{display:flex;gap:8px}
.primary{flex:1;border:0;background:var(--accent);color:var(--paper);border-radius:12px;padding:13px;font-weight:700;font-size:16px}
.ghost{border:1px solid var(--line);background:none;border-radius:12px;padding:12px 14px}
.danger{border:1px solid var(--bad);color:var(--bad);background:none;border-radius:12px;padding:12px 14px}

.list{margin-top:22px}
.day{font-size:13px;color:var(--muted);margin:16px 4px 6px;display:flex;justify-content:space-between}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:6px}
.item[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ico{font-size:20px;width:28px;text-align:center}
.item .mid{flex:1;min-width:0}
.item .c{font-size:15px;font-weight:500}
.item .m{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .a{font-weight:700;font-size:15px;white-space:nowrap}
.inc{color:var(--good)}
.empty{text-align:center;color:var(--muted);padding:28px 8px;font-size:14px}
.foot{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.on{opacity:1}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--chip);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{border:0;background:none;padding:9px;border-radius:11px;font-weight:700;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--paper);color:var(--accent);box-shadow:0 1px 2px rgba(20,50,74,.15)}
.sec{font-size:15px;font-weight:700;margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.pay{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.pay .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pay .when{font-weight:700}
.pay .sub{font-size:13px;color:var(--muted);margin-top:2px}
.pay .net{font-weight:700;font-size:17px;white-space:nowrap}
.pay .bot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted)}
.tag.on{background:var(--accent);color:var(--paper)}
.small{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:10px;padding:5px 10px;font-size:13px;font-weight:500}
.small.done{border-color:var(--line);color:var(--muted)}
.jobsum{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.jobsum .r{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:2px 0}
.jobsum .r b{color:var(--ink);font-weight:500}
.jobsum h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between}
.lab{font-size:13px;color:var(--muted);margin:0 0 6px;display:block}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.times input{width:100%}
select.t{appearance:auto}
.jobcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.jobcard .d{font-size:13px;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr 130px auto;gap:8px;align-items:center;margin-bottom:8px;font-size:15px}
.prow input{text-align:right;width:100%}
.prow .u{color:var(--muted);font-size:14px}
.ptot{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin:6px 0 12px}
.ptot b{color:var(--ink)}
.pitem{margin-bottom:12px}
.pitem .ph{display:flex;justify-content:space-between;font-size:15px;margin-bottom:5px}
.pitem .pf{font-size:12px;color:var(--muted);margin-top:3px;text-align:right}
.gauge.thin{height:8px}
.wallet{margin-bottom:12px}
.tabs.tabs3{grid-template-columns:1fr 1fr 1fr}
.sum.sum4{grid-template-columns:1fr 1fr}
.warnbox{background:var(--paper);border:1.5px solid var(--warn);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.warnbox.bad{border-color:var(--bad)}
.warnbox .wt{font-weight:700;font-size:14px;margin-bottom:4px;color:var(--warn)}
.warnbox.bad .wt{color:var(--bad)}
.warnbox p,.alert p{margin:4px 0;font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(10,25,40,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.alert{background:var(--paper);border-radius:20px;padding:20px;max-width:380px;width:100%;border-top:6px solid var(--warn)}
.alert.bad{border-top-color:var(--bad)}
.alert .at{font-weight:700;font-size:18px;margin-bottom:8px}
.alert p{margin-bottom:10px}
.alert button{margin-top:8px}
.pot{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.pot .ph{display:flex;justify-content:space-between;align-items:center}
.pot .pn{font-weight:700;font-size:16px}
.pot .pb{font-size:26px;font-weight:700;margin:4px 0 8px}
.pot .pb small{font-size:14px;color:var(--muted);font-weight:500}
.pot .pinfo{font-size:13px;color:var(--muted);margin-top:6px}
.pot .pinfo b{color:var(--ink)}
.potact{margin-top:12px}
.xbtn{border:0;background:none;color:var(--muted);font-size:20px;padding:0 4px;margin-left:4px}
.small:disabled{opacity:.5;cursor:default}
.cal{padding:12px 8px}
.cw,.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cw span{text-align:center;font-size:12px;color:var(--muted);padding-bottom:6px}
.sun{color:var(--bad)!important}.sat{color:var(--accent)!important}
.cd{min-height:64px;border:1px solid transparent;border-radius:10px;background:none;padding:3px 2px;display:flex;flex-direction:column;align-items:stretch;gap:2px;text-align:center;min-width:0}
.cd.empty{pointer-events:none}
.cd:not(.empty):hover{background:var(--chip)}
.cd.today .dn{background:var(--ink);color:var(--paper)!important;border-radius:99px}
.cd.sel{border-color:var(--accent);background:var(--chip)}
.dn{font-size:13px;font-weight:500;position:relative;align-self:center;min-width:22px;line-height:22px}
.pd{position:absolute;top:-6px;right:-12px;font-style:normal;font-size:10px}
.bar{display:block;color:#fff;font-size:10px;font-weight:700;border-radius:4px;line-height:15px;white-space:nowrap;overflow:hidden}
.more{font-size:10px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;padding:8px 4px 0;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.dot{width:12px;height:12px;border-radius:4px;flex:0 0 auto;margin:0 8px 0 4px}
.tabs.tabs4{grid-template-columns:repeat(4,1fr)}
.tabs.tabs4 button{font-size:14px;padding:9px 2px}
.sum .wide{grid-column:1/-1}
.rh{margin-top:8px;font-size:13px;color:var(--muted)}
.rh summary{cursor:pointer}
.rr{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
const CATS=[["식비","🍚"],["카페/간식","☕"],["교통","🚌"],["쇼핑","🛍️"],["취미/여가","🎟️"],["통신/구독","📱"],["스노우보드","🏂"],["여행","✈️"],["기타","📦"]];
const DEFAULT_JOBS=[
  {id:"j-sapiens",name:"사피엔스 알바",icon:"☕",wage:10320,ratio:100,tax:true,night:false,cycle:"month",payDay:10,payOffset:1,payWeekday:5},
  {id:"j-island",name:"아일랜드 알바",icon:"🧋",wage:10320,ratio:100,tax:true,night:false,cycle:"month",payDay:10,payOffset:1,payWeekday:5},
  {id:"j-academy",name:"학원 알바",icon:"✏️",wage:10320,ratio:100,tax:true,night:false,cycle:"month",payDay:10,payOffset:1,payWeekday:5}
];
const LS_KEY="hyena-gagyebu-v1";
const WD="일월화수목금토";

let S={settings:{},months:{}};
let mode="loading", coll=null;
const pad=n=>String(n).padStart(2,"0");
const now=new Date();
const fmtD=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>new Date(s+"T00:00:00");
const todayStr=fmtD(now);
const curKey=todayStr.slice(0,7);
let view=curKey, tab="book";
let form={type:"out",cat:"식비",src:"",amount:"",date:todayStr,memo:"",editing:null};
let shiftForm={job:null,date:todayStr,start:"18:00",end:"23:00",brk:0,editing:null,rep:false,wds:[],until:""};
let selDay=todayStr, debtDraft=null, debtAct=null, debtAmt="", walletEdit=false;
const JOB_COLORS=["#3B8FD9","#E07A5F","#2A9D8F","#9B6BD3","#D4A017","#E76F98"];
const jobColor=id=>{const i=jobs().findIndex(j=>j.id===id);return i<0?"#8A97A8":JOB_COLORS[i%JOB_COLORS.length]};
let editingBudget=false, jobDraft=null, delArm=false, planDraft=null, potDraft=null, potAct=null, alertBox=null, potAmt="";
const DEFAULT_POTS=[{id:"p-trip",name:"여행",icon:"✈️",goal:0,due:""},{id:"p-snow",name:"스노우보드",icon:"🏂",goal:0,due:""}];
const POT_ICONS=["✈️","🏂","🎁","💻","🎟️","🏠","💰"];

const won=n=>Math.round(n).toLocaleString("ko-KR");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uidGen=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const shiftMonth=(k,d)=>{let[y,m]=k.split("-").map(Number);m+=d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return `${y}-${pad(m)}`};
const monthLabel=k=>{const[y,m]=k.split("-");return `${y}년 ${Number(m)}월`};
const shortM=k=>`${Number(k.split("-")[1])}월`;
const md=s=>{const d=parseD(s);return `${d.getMonth()+1}/${d.getDate()}`};
const dayLabel=d=>{const dt=parseD(d);return `${dt.getMonth()+1}월 ${dt.getDate()}일 (${WD[dt.getDay()]})`};
const daysIn=k=>{const[y,m]=k.split("-").map(Number);return new Date(y,m,0).getDate()};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const hm=min=>{const h=Math.floor(min/60),m=Math.round(min%60);return m?`${h}시간 ${m}분`:`${h}시간`};

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2200)}

/* ---------- storage ---------- */
const queues={};
function saveDoc(id,data){
  if(mode==="db"&&coll){
    queues[id]=(queues[id]||Promise.resolve()).then(()=>coll.doc(id).set(data)).catch(e=>{
      toast(e&&e.code==="quota_exceeded"?"저장 공간이 꽉 찼어요.":"저장하지 못했어요. 잠시 후 다시 해주세요.");
    });
  }else{
    try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){toast("이 브라우저에서는 저장이 안 돼요.")}
  }
}
const blankMonth=()=>({budget:null,entries:[],shifts:[],plan:null,saves:[],repays:[]});
function saveMonth(k){const m=S.months[k];saveDoc("m-"+k,{budget:m.budget??null,entries:m.entries,shifts:m.shifts||[],plan:m.plan||null,saves:m.saves||[],repays:m.repays||[]})}
function saveSettings(){saveDoc("settings",JSON.parse(JSON.stringify(S.settings)))}
function normMonth(v){v=v||{};return{budget:typeof v.budget==="number"?v.budget:null,entries:Array.isArray(v.entries)?v.entries.map(e=>({...e})):[],shifts:Array.isArray(v.shifts)?v.shifts.map(e=>({...e})):[],plan:v.plan&&typeof v.plan==="object"?{...v.plan}:null,saves:Array.isArray(v.saves)?v.saves.map(e=>({...e})):[],repays:Array.isArray(v.repays)?v.repays.map(e=>({...e})):[]}}

function useLocal(){
  mode="local";
  try{const raw=localStorage.getItem(LS_KEY);if(raw){const p=JSON.parse(raw);S={settings:p.settings||{},months:{}};for(const k in (p.months||{}))S.months[k]=normMonth(p.months[k])}}catch(e){}
  render();
}
async function boot(){
  render();
  if(!window.claude||typeof window.claude.use!=="function"){useLocal();return}
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    const id=user?await user.id():null;
    if(!db||!id){useLocal();return}
    coll=db.collection("data/users/"+id);
    mode="db";
    coll.limit(1000).onSnapshot(snap=>{
      const next={settings:{},months:{}};
      for(const d of snap.docs){
        const v=d.data()||{};
        if(d.id==="settings")next.settings=JSON.parse(JSON.stringify(v));
        else if(d.id.startsWith("m-"))next.months[d.id.slice(2)]=normMonth(v);
      }
      S=next;render();
    },()=>{toast("연결이 끊겼어요. 새로고침 해주세요.")});
  }catch(e){useLocal()}
}

/* ---------- budget math ---------- */
const monthOf=k=>S.months[k]||blankMonth();
const spentOf=k=>monthOf(k).entries.filter(e=>e.type==="out").reduce((a,e)=>a+e.amount,0);
const borrowedIn=k=>debts().filter(d=>d.date&&d.date.slice(0,7)===k);
const borrowedAmt=k=>borrowedIn(k).reduce((a,d)=>a+d.amount,0);
const incomeOf=k=>monthOf(k).entries.filter(e=>e.type==="in").reduce((a,e)=>a+e.amount,0)+borrowedIn(k).reduce((a,d)=>a+d.amount,0);
function budgetOf(k){
  const m=S.months[k];
  if(m&&typeof m.budget==="number")return m.budget;
  if(k>=curKey&&typeof S.settings.budget==="number")return S.settings.budget;
  return null;
}
function carryInto(k){
  let c=0;
  for(const j of Object.keys(S.months).sort()){
    if(j>=k)break;
    const m=S.months[j];
    if(typeof m.budget!=="number")continue;
    c+=m.budget+borrowedAmt(j)-repaidIn(j)-spentOf(j);
  }
  return c;
}
function ensureMonth(k,withBudget){

function planOf(k){

}
const spentByCat=k=>{const o={};for(const e of monthOf(k).entries)if(e.type==="out")o[e.cat]=(o[e.cat]||0)+e.amount;return o};

/* ---------- warnings ---------- */
const lvl=p=>p>=1?2:p>=0.8?1:0;
function totalState(k){const b=budgetOf(k);if(b==null)return null;const total=b+carryInto(k)+borrowedAmt(k)-repaidIn(k),spent=spentOf(k);return{total,spent,pct:total>0?spent/total:1}}
function warningsFor(k){
  const w=[];
  const t=totalState(k);
  if(t){
    if(t.pct>=1)w.push({l:2,m:`이번 달 예산을 <b>${won(t.spent-t.total)}원</b> 넘었어요. 넘친 만큼 다음 달 예산이 줄어요.`});
    else if(t.pct>=0.8)w.push({l:1,m:`예산의 <b>${Math.round(t.pct*100)}%</b>를 썼어요. 남은 돈은 <b>${won(t.total-t.spent)}원</b>이에요.`});
    if(k===curKey&&t.pct<1){
      const day=now.getDate(),dim=daysIn(k);
      const proj=t.spent/day*dim;
      if(day>=3&&proj>t.total&&t.pct>day/dim+0.1){
        const left=dim-day+1;
        w.push({l:1,m:`지금 속도면 월말에 약 <b>${won(Math.round((proj-t.total)/1000)*1000)}원</b> 초과해요. 남은 ${left}일 동안 하루 <b>${won(Math.floor((t.total-t.spent)/left/100)*100)}원</b> 이하로 써야 맞출 수 있어요.`});
      }
    }
  }
  if(k===curKey)for(const d of debts()){
    const left=leftOf(d);if(!left||!d.due)continue;const n=dday(d.due);
    if(n<0)w.push({l:2,m:`${esc(d.name)}에게 갚기로 한 날이 <b>${-n}일 지났어요</b>. <b>${won(left)}원</b> 남았어요.`});
    else if(n<=7)w.push({l:1,m:`${esc(d.name)}에게 갚을 날까지 <b>${n===0?"오늘":"D-"+n}</b>. <b>${won(left)}원</b> 남았어요.`});
  }
  const plan=planOf(k);
  if(plan){const sp=spentByCat(k);for(const [c] of CATS){const p=plan[c]||0,u=sp[c]||0;if(!p)continue;
    if(u>=p)w.push({l:2,m:`${esc(c)} 계획을 <b>${won(u-p)}원</b> 넘었어요.`});
    else if(u/p>=0.8)w.push({l:1,m:`${esc(c)} 계획의 <b>${Math.round(u/p*100)}%</b>를 썼어요. <b>${won(p-u)}원</b> 남았어요.`});}}
  return w.sort((a,b)=>b.l-a.l);
}
function catLevel(k,c){const p=planOf(k);if(!p||!p[c])return 0;return lvl((spentByCat(k)[c]||0)/p[c])}
function warnHTML(){
  if(mode==="loading")return "";

  return `<section class="warnbox ${w[0].l===2?"bad":""}" role="alert"><div class="wt">${w[0].l===2?"🚨 초과 경고":"⚠️ 주의"}</div>${w.map(x=>`<p>${x.m}</p>`).join("")}</section>`;

const debts=()=>Array.isArray(S.settings.debts)?S.settings.debts:[];
const allRepays=()=>{const o=[];for(const k in S.months)for(const r of (S.months[k].repays||[]))o.push(r);return o};
const paidOf=id=>allRepays().filter(r=>r.debt===id).reduce((a,r)=>a+r.amount,0);
const leftOf=d=>Math.max(0,d.amount-paidOf(d.id));
const repaidIn=k=>(monthOf(k).repays||[]).reduce((a,r)=>a+r.amount,0);
const dday=s=>Math.round((parseD(s)-parseD(todayStr))/864e5);

/* ---------- pots ---------- */
const pots=()=>Array.isArray(S.settings.pots)?S.settings.pots:DEFAULT_POTS;
const allSaves=()=>{const o=[];for(const k in S.months)for(const s of (S.months[k].saves||[]))o.push(s);return o};
const potBal=id=>allSaves().filter(s=>s.pot===id).reduce((a,s)=>a+s.amount,0);
const savedIn=k=>(monthOf(k).saves||[]).reduce((a,s)=>a+s.amount,0);
function monthsBetween(a,b){const[y1,m1]=a.split("-").map(Number),[y2,m2]=b.split("-").map(Number);return (y2-y1)*12+(m2-m1)}

/* ---------- pay math ---------- */
const jobs=()=>Array.isArray(S.settings.jobs)&&S.settings.jobs.length?S.settings.jobs:DEFAULT_JOBS;
const jobById=id=>jobs().find(j=>j.id===id);
const toMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
function shiftCalc(sh){
  let s=toMin(sh.start),e=toMin(sh.end);
  if(e<=s)e+=1440;
  const total=e-s, work=Math.max(0,total-(sh.brk||0));
  let night=0;
  for(const [a,b] of [[-120,360],[1320,1800],[2760,3240]]){night+=Math.max(0,Math.min(e,b)-Math.max(s,a))}
  night=Math.min(night,work);
  return{work,night};
}
function grossOf(job,shifts){
  let work=0,night=0,base=0,nightPay=0;
  for(const sh of shifts){
    const c=shiftCalc(sh),rate=job.wage*((sh.ratio??job.ratio)/100);
    work+=c.work;night+=c.night;base+=c.work/60*rate;
    if(job.night)nightPay+=c.night/60*rate*0.5;
  }
  return{work,night,base,nightPay,gross:Math.floor(base+nightPay)};
}
function taxOf(job,gross){
  if(!job.tax)return 0;
  const inc=Math.floor(gross*0.03/10)*10;
  return inc+Math.floor(inc*0.1/10)*10;
}
const allShifts=()=>{const out=[];for(const k in S.months)for(const sh of (S.months[k].shifts||[]))out.push(sh);return out};
function payoutsIn(K){
  const res=[], shifts=allShifts();
  for(const job of jobs()){
    if(job.cycle==="month"){
      const W=shiftMonth(K,-(job.payOffset??1));
      const list=shifts.filter(s=>s.job===job.id&&s.date.slice(0,7)===W);
      if(!list.length)continue;
      const day=job.payDay==="last"?daysIn(K):Math.min(Number(job.payDay)||10,daysIn(K));
      const g=grossOf(job,list),tax=taxOf(job,g.gross);
      res.push({job,date:`${K}-${pad(day)}`,period:`${shortM(W)} 근무분`,key:`${job.id}|${W}`,shifts:list,...g,tax,net:g.gross-tax});
    }else{
      const wd=Number(job.payWeekday??5);
      for(let d=1;d<=daysIn(K);d++){
        const dt=parseD(`${K}-${pad(d)}`);
        if(dt.getDay()!==wd)continue;
        const same=(job.payWeekOffset??1)===0;
        const mon=same?addDays(dt,-6):addDays(dt,-((dt.getDay()+6)%7)-7), sun=same?dt:addDays(mon,6);
        const a=fmtD(mon),b=fmtD(sun);
        const list=shifts.filter(s=>s.job===job.id&&s.date>=a&&s.date<=b);
        if(!list.length)continue;
        const g=grossOf(job,list),tax=taxOf(job,g.gross);
        res.push({job,date:fmtD(dt),period:`${md(a)}~${md(b)} 근무분`,key:`${job.id}|${a}`,shifts:list,...g,tax,net:g.gross-tax});
      }
    }
  }
  return res.sort((x,y)=>x.date<y.date?-1:1);
}
const recordedKeys=()=>{const s=new Set();for(const k in S.months)for(const e of S.months[k].entries)if(e.payKey)s.add(e.payKey);return s};
function payDesc(j){

    :`주급 · ${(j.payWeekOffset??1)===0?"그 주":"다음 주"} ${WD[j.payWeekday??5]}요일 지급`;
}

  const after=(date,created)=>date<=todayStr&&(date>w.date||(date===w.date&&created!=null&&created>w.ts));
  let v=w.amount;
  for(const k in S.months){const m=S.months[k];
    for(const e of m.entries)if(after(e.date,e.created||0))v+=e.type==="in"?e.amount:-e.amount;
    for(const r of (m.repays||[]))if(after(r.date,r.created||0))v-=r.amount;}
  for(const d of debts())if(d.date&&d.date>w.date&&d.date<=todayStr)v+=d.amount;

}

    return `<section class="card" id="planCard" style="margin-bottom:18px">
      <h2>어디에 얼마 쓸지 정하기</h2>
      ${CATS.map(([c,i])=>`<div class="prow"><span>${i} ${esc(c)}</span><input class="t num" inputmode="numeric" data-plan="${esc(c)}" value="${planDraft[c]?won(planDraft[c]):""}" placeholder="0" aria-label="${esc(c)} 예산"><span class="u">원</span></div>`).join("")}
      <div class="ptot" id="planTot">${planTotText(tot,b)}</div>
      <div class="actions"><button class="primary" data-act="savePlan">저장</button><button class="ghost" data-act="cancelPlan">취소</button></div>
      <p class="lab" style="margin:10px 0 0">저장하면 다음 달에도 같은 계획으로 시작해요. 달마다 따로 고칠 수 있어요.</p>
    </section>`;
  }
  const plan=planOf(view);
  if(!plan)return `<section class="card" style="margin-bottom:18px"><h2>어디에 얼마 쓸지</h2>
    <p style="margin:0 0 12px;color:var(--muted);font-size:14px">카테고리마다 이번 달에 쓸 돈을 미리 정해두면, 어디서 얼마나 남았는지 바로 보여요.</p>
    <button class="primary" style="width:100%" data-act="editPlan">계획 세우기</button></section>`;
  const sp=spentByCat(view);
  const rows=CATS.filter(([c])=>(plan[c]||0)>0||(sp[c]||0)>0).map(([c,i])=>{
    const p=plan[c]||0,u=sp[c]||0,left=p-u;
    const pct=p>0?u/p:1, col=pct>=1?"var(--bad)":pct>=0.8?"var(--warn)":"var(--good)";
    return `<div class="pitem"><div class="ph"><span>${i} ${esc(c)}</span><span class="num" style="color:${left<0?"var(--bad)":"var(--ink)"}">${p?(left<0?`${won(-left)}원 초과`:`${won(left)}원 남음`):"계획 없음"}</span></div>
      <div class="gauge thin"><i style="width:${Math.min(100,pct*100)}%;background:${col}"></i></div>
      <div class="pf num">${won(u)} / ${won(p)}원</div></div>`;
  }).join("");
  const tot=CATS.reduce((a,[c])=>a+(plan[c]||0),0);
  return `<section class="card" style="margin-bottom:18px"><h2 style="display:flex;justify-content:space-between;align-items:center"><span>어디에 얼마 쓸지</span><button class="linkbtn" data-act="editPlan">수정</button></h2>
    ${rows||`<p class="lab">계획한 카테고리가 없어요.</p>`}
    <div class="ptot">${planTotText(tot,b)}</div></section>`;
}
function planTotText(tot,b){
  if(b==null)return `배정한 돈 합계 <b class="num">${won(tot)}원</b>`;
  const d=b-tot;
  return `배정 합계 <b class="num">${won(tot)}원</b> / 월 예산 ${won(b)}원 · ${d>=0?`<span class="num">${won(d)}원 안 정함</span>`:`<span class="num" style="color:var(--bad)">${won(-d)}원 넘게 배정</span>`}`;
}

  </section>`;
}
function calendarHTML(pays){
  const [y,m]=view.split("-").map(Number);
  const first=new Date(y,m-1,1).getDay(), dim=daysIn(view);
  const shifts=monthOf(view).shifts||[];
  const byDay={};for(const sh of shifts)(byDay[sh.date]=byDay[sh.date]||[]).push(sh);
  const payDays=new Set(pays.map(p=>p.date));
  if(!selDay||selDay.slice(0,7)!==view)selDay=view===curKey?todayStr:`${view}-01`;
  let cells="";
  for(let i=0;i<first;i++)cells+=`<div class="cd empty"></div>`;
  for(let d=1;d<=dim;d++){
    const ds=`${view}-${pad(d)}`, list=(byDay[ds]||[]).sort((a,b)=>a.start<b.start?-1:1);
    const wd=(first+d-1)%7;
    cells+=`<button class="cd${ds===todayStr?" today":""}${ds===selDay?" sel":""}" data-act="selDay" data-v="${ds}" aria-label="${dayLabel(ds)}${list.length?`, 근무 ${list.length}개`:""}">
      <span class="dn${wd===0?" sun":wd===6?" sat":""}">${d}${payDays.has(ds)?`<i class="pd" title="지급일">💰</i>`:""}</span>
      ${list.slice(0,3).map(sh=>{const h=shiftCalc(sh).work/60;return `<span class="bar" style="background:${jobColor(sh.job)}">${Number.isInteger(h)?h:h.toFixed(1)}h</span>`}).join("")}
      ${list.length>3?`<span class="more">+${list.length-3}</span>`:""}
    </button>`;
  }
  const dayList=(byDay[selDay]||[]).sort((a,b)=>a.start<b.start?-1:1);
  const dayPays=pays.filter(p=>p.date===selDay);
  const used=new Set(shifts.map(s=>s.job));
  return `<div class="sec"><span>${shortM(view)} 근무 달력</span></div>
    <section class="card cal">
      <div class="cw">${[..."일월화수목금토"].map((w,i)=>`<span class="${i===0?"sun":i===6?"sat":""}">${w}</span>`).join("")}</div>
      <div class="cg">${cells}</div>
      ${used.size?`<div class="legend">${jobs().filter(j=>used.has(j.id)).map(j=>`<span><i style="background:${jobColor(j.id)}"></i>${esc(j.name)}</span>`).join("")}</div>`:""}
    </section>
    <div class="daybox">
      <div class="sec" style="margin-top:14px"><span>${dayLabel(selDay)}</span><button class="linkbtn" data-act="addOnDay">+ 이 날 근무 추가</button></div>
      ${dayPays.map(p=>`<div class="pay"><div class="top"><span class="when">💰 ${esc(p.job.name)} 지급일</span><span class="net num">${won(p.net)}원</span></div><div class="sub">${p.period}</div></div>`).join("")}
      ${dayList.length?dayList.map(s=>{
        const j=jobById(s.job)||{name:"삭제된 알바",icon:"💼"};const c=shiftCalc(s);
        return `<button class="item" data-act="editShift" data-id="${esc(s.id)}" aria-current="${shiftForm.editing===s.id}">
          <span class="dot" style="background:${jobColor(s.job)}"></span>
          <span class="mid"><span class="c">${esc(j.name)}</span><span class="m" style="display:block">${s.grp?"🔁 ":""}${s.start}~${s.end}${s.brk?` · 휴게 ${s.brk}분`:""}${s.ratio!=null?` · ${s.ratio}%`:""}</span></span>
          <span class="a num">${hm(c.work)}</span></button>`}).join(""):(dayPays.length?"":`<div class="empty" style="padding:14px">이 날은 근무가 없어요.</div>`)}
    </div>`;
}
function shiftListHTML(){

}

/* ---------- actions ---------- */
const digits=s=>String(s).replace(/[^\d]/g,"");
function findEntry(id){for(const k in S.months){const i=S.months[k].entries.findIndex(e=>e.id===id);if(i>-1)return{k,i,e:S.months[k].entries[i]}}return null}
function findShift(id){for(const k in S.months){const a=S.months[k].shifts||[];const i=a.findIndex(e=>e.id===id);if(i>-1)return{k,i,e:a[i]}}return null}
const defaultDate=()=>view===curKey?todayStr:view+"-01";
function resetForm(){form={type:form.type,cat:form.cat,src:form.src,amount:"",date:defaultDate(),memo:"",editing:null}}
function resetShift(){shiftForm={...shiftForm,date:defaultDate(),editing:null,grp:null,ratio:null,rep:false,wds:[],until:""}}
function repDates(s){
  const out=[];if(!s.until||s.until<s.date||!s.wds.length)return out;
  let d=parseD(s.date);const end=parseD(s.until);
  while(d<=end&&out.length<200){if(s.wds.includes(d.getDay()))out.push(fmtD(d));d=addDays(d,1)}
  return out;
}
function repPreview(){const n=repDates(shiftForm).length;return n?`총 <b>${n}번</b> 기록돼요.`:`요일과 끝나는 날을 골라주세요.`}
function commitJobs(list){S.settings.jobs=list;saveSettings()}

document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="amtIn"||t.id==="budgetIn"||t.id==="jWage"){
    const d=digits(t.value).slice(0,10);
    t.value=d?Number(d).toLocaleString("ko-KR"):"";
    if(t.id==="amtIn")form.amount=t.value;
    if(t.id==="jWage")jobDraft.wage=Number(d)||0;
  }
  if(t.dataset&&t.dataset.plan&&planDraft){
    const d=digits(t.value).slice(0,10);
    t.value=d?Number(d).toLocaleString("ko-KR"):"";
    planDraft[t.dataset.plan]=Number(d)||0;
    const el=document.getElementById("planTot");
    if(el)el.innerHTML=planTotText(CATS.reduce((a,[c])=>a+(planDraft[c]||0),0),budgetOf(view));
  }
  if(t.id==="potAmt"||t.id==="pGoal"){
    const d=digits(t.value).slice(0,10);t.value=d?Number(d).toLocaleString("ko-KR"):"";
    if(t.id==="potAmt")potAmt=t.value;else potDraft.goal=Number(d)||0;
  }
  if(t.id==="pName")potDraft.name=t.value;
  if(t.id==="debtAmt"||t.id==="dAmt"){
    const d=digits(t.value).slice(0,10);t.value=d?Number(d).toLocaleString("ko-KR"):"";
    if(t.id==="debtAmt")debtAmt=t.value;else debtDraft.amount=Number(d)||0;
  }
  if(t.id==="dName")debtDraft.name=t.value;
  if(t.id==="dDate")debtDraft.date=t.value;
  if(t.id==="dDue")debtDraft.due=t.value;
  if(t.id==="dMemo")debtDraft.memo=t.value;
  if(t.id==="pDue")potDraft.due=t.value;
  if(t.id==="walletIn"){const d=digits(t.value).slice(0,11);t.value=d?Number(d).toLocaleString("ko-KR"):"";}
  if(t.id==="memoIn")form.memo=t.value;
  if(t.id==="dateIn")form.date=t.value;
  if(t.id==="jName")jobDraft.name=t.value;
  if(t.id==="sDate"||t.id==="sUntil"){
    if(t.id==="sDate")shiftForm.date=t.value;else shiftForm.until=t.value;
    const p=document.getElementById("sRepPrev");if(p)p.innerHTML=repPreview();
  }
  if(t.id==="sStart"||t.id==="sEnd"){
    shiftForm[t.id==="sStart"?"start":"end"]=t.value;
    const p=document.getElementById("sPrev");
    if(p&&shiftForm.start&&shiftForm.end){const c=shiftCalc(shiftForm);p.textContent=`${hm(c.work)} 근무${c.night?` (야간 ${hm(c.night)})`:""}`}
  }
});
document.addEventListener("change",ev=>{
  if(ev.target.id==="jDay")jobDraft.payDay=ev.target.value==="last"?"last":Number(ev.target.value);
  if(ev.target.id==="impFile"){
    const f=ev.target.files&&ev.target.files[0];
    if(!f)return;
    const r=new FileReader();
    r.onload=()=>{let o=null;try{o=JSON.parse(String(r.result))}catch(e){}
      if(!o){toast("백업 파일을 읽지 못했어요.");return}
      if(applyDoc(o,true)){toast("가계부를 가져왔어요.");useLocal();}else render();};
    r.readAsText(f,"utf-8");
  }
});
document.addEventListener("keydown",ev=>{
  if(ev.key!=="Enter")return;
  if(ev.target.id==="amtIn"||ev.target.id==="memoIn"){ev.preventDefault();act("submit")}
  if(ev.target.id==="budgetIn"){ev.preventDefault();act("saveBudget")}
  if(ev.target.id==="walletIn"){ev.preventDefault();act("saveWallet")}
  if(ev.target.id==="potAmt"){ev.preventDefault();act("potDo")}
  if(ev.target.id==="debtAmt"){ev.preventDefault();act("debtDo")}
});
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");if(!b||b.disabled)return;
  act(b.dataset.act,b.dataset);
});

function act(a,ds={}){
  if(mode==="loading"&&!["prev","next","type","cat","src","tab"].includes(a))return;
  if(a!=="delJob"&&a!=="delPot"&&a!=="delDebt")delArm=false;
  switch(a){
    case "tab":tab=ds.v;jobDraft=null;planDraft=null;potDraft=null;potAct=null;debtDraft=null;debtAct=null;break;
    case "exportJson":{
      const doc=JSON.stringify(S,null,1);
      const a=document.createElement("a");
      const url=URL.createObjectURL(new Blob([doc],{type:"application/json"}));
      a.href=url;a.download="hyena-gagyebu-backup-"+todayStr+".json";
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),10000);
      toast("백업 파일을 만들었어요.");break;
    }
    case "pickImport":{const el=document.getElementById("impFile");if(el)el.click();break}
    case "newDebt":debtDraft={id:"d-"+uidGen(),name:"",amount:0,date:todayStr,due:"",memo:"",isNew:true};break;
    case "editDebt":{const d=debts().find(x=>x.id===ds.id);if(d)debtDraft={...d};break}
    case "cancelDebt":debtDraft=null;break;
    case "saveDebt":{
      const d={...debtDraft};delete d.isNew;d.name=(d.name||"").trim().slice(0,20);d.memo=(d.memo||"").trim().slice(0,60);
      if(!d.name){toast("누구에게 빌렸는지 적어주세요.");return}
      if(!d.amount){toast("빌린 금액을 적어주세요.");return}
      const list=debts().map(x=>({...x}));const i=list.findIndex(x=>x.id===d.id);
      if(i>-1)list[i]=d;else list.push(d);
      S.settings.debts=list;saveSettings();debtDraft=null;toast("저장했어요.");break;
    }
    case "delDebt":{
      if(!delArm){delArm=true;break}
      const id=debtDraft.id;
      S.settings.debts=debts().filter(x=>x.id!==id).map(x=>({...x}));saveSettings();
      for(const k in S.months){const a=S.months[k].repays||[];const keep=a.filter(r=>r.debt!==id);if(keep.length!==a.length){S.months[k].repays=keep;saveMonth(k)}}
      debtDraft=null;delArm=false;toast("삭제했어요.");break;
    }
    case "debtPay":debtAct={id:ds.id};debtAmt="";render();document.getElementById("debtAmt")?.focus();return;
    case "debtCancel":debtAct=null;break;
    case "debtAll":{const d=debts().find(x=>x.id===debtAct.id);debtAmt=won(leftOf(d));break}
    case "debtDo":{
      const amt=Number(digits(debtAmt));const d=debts().find(x=>x.id===debtAct.id);
      if(!amt){toast("갚은 금액을 적어주세요.");return}
      if(amt>leftOf(d)){toast(`남은 돈(${won(leftOf(d))}원)보다 많아요.`);return}
      ensureMonth(curKey).repays.push({id:uidGen(),debt:d.id,amount:amt,date:todayStr,created:Date.now()});
      saveMonth(curKey);debtAct=null;debtAmt="";
      toast(leftOf(d)<=0?"🎉 다 갚았어요!":"갚은 돈을 기록했어요.");break;
    }
    case "delRepay":{
      for(const k in S.months){const a=S.months[k].repays||[];const i=a.findIndex(r=>r.id===ds.id);if(i>-1){a.splice(i,1);saveMonth(k);toast("기록을 삭제했어요.");break}}
      break;
    }
    case "closeAlert":alertBox=null;break;
    case "editWallet":walletEdit=true;break;
    case "cancelWallet":walletEdit=false;break;
    case "saveWallet":{
      const raw=digits(document.getElementById("walletIn").value);
      if(raw===""){toast("금액을 적어주세요.");return}
      S.settings.wallet={amount:Number(raw),date:todayStr,ts:Date.now()};saveSettings();
      walletEdit=false;toast("잔액을 맞췄어요.");break;
    }
    case "goDebt":tab="debt";window.scrollTo(0,0);break;
    case "newPot":potDraft={id:"p-"+uidGen(),name:"",icon:"💰",goal:0,due:"",isNew:true};break;
    case "editPot":{const p=pots().find(x=>x.id===ds.id);if(p)potDraft={...p};break}
    case "cancelPot":potDraft=null;break;
    case "pIcon":potDraft.icon=ds.v;break;
    case "savePot":{
      const d={...potDraft};delete d.isNew;d.name=(d.name||"").trim().slice(0,20);
      if(!d.name){toast("저금칸 이름을 적어주세요.");return}
      const list=pots().map(p=>({...p}));const i=list.findIndex(p=>p.id===d.id);
      if(i>-1)list[i]=d;else list.push(d);
      S.settings.pots=list;saveSettings();potDraft=null;toast("저금칸을 저장했어요.");break;
    }
    case "delPot":{
      if(!delArm){delArm=true;break}
      S.settings.pots=pots().filter(p=>p.id!==potDraft.id).map(p=>({...p}));saveSettings();
      potDraft=null;delArm=false;toast("저금칸을 삭제했어요.");break;
    }
    case "potIn":case "potOut":potAct={id:ds.id,mode:a==="potIn"?"in":"out"};potAmt="";render();document.getElementById("potAmt")?.focus();return;
    case "potCancel":potAct=null;break;
    case "potDo":{
      const amt=Number(digits(potAmt));
      if(!amt){toast("금액을 적어주세요.");return}
      if(potAct.mode==="out"&&amt>potBal(potAct.id)){toast("저금칸에 있는 돈보다 많아요.");return}
      const date=view===curKey?todayStr:(view<curKey?view+"-"+pad(daysIn(view)):view+"-01");
      const k=date.slice(0,7);
      ensureMonth(k).saves.push({id:uidGen(),pot:potAct.id,amount:potAct.mode==="in"?amt:-amt,date,created:Date.now()});
      saveMonth(k);toast(potAct.mode==="in"?"저금했어요.":"꺼냈어요.");potAct=null;potAmt="";break;
    }
    case "delSave":{
      for(const k in S.months){const a=S.months[k].saves||[];const i=a.findIndex(s=>s.id===ds.id);if(i>-1){a.splice(i,1);saveMonth(k);toast("저금 기록을 삭제했어요.");break}}
      break;
    }
    case "prev":case "next":
      view=shiftMonth(view,a==="prev"?-1:1);editingBudget=false;planDraft=null;potAct=null;
      if(!form.editing)form.date=defaultDate();
      if(!shiftForm.editing)shiftForm.date=defaultDate();
      break;
    case "type":form.type=ds.v;break;
    case "cat":form.cat=ds.v;break;
    case "src":form.src=ds.v;break;
    case "editBudget":editingBudget=true;break;
    case "cancelBudget":editingBudget=false;break;
    case "clearBudget":S.settings.budget=null;saveSettings();ensureMonth(view).budget=null;saveMonth(view);editingBudget=false;toast("월 예산을 없앰어요.");break;
    case "saveBudget":{
      const v=Number(digits(document.getElementById("budgetIn").value));
      if(!v){toast("예산 금액을 적어주세요.");return}
      S.settings.budget=v;saveSettings();
      ensureMonth(view).budget=v;saveMonth(view);
      editingBudget=false;toast("예산을 저장했어요.");break;
    }
    case "submit":{
      const amount=Number(digits(form.amount));
      if(!amount){toast("금액을 적어주세요.");document.getElementById("amtIn")?.focus();return}
      if(!/^\d{4}-\d{2}-\d{2}$/.test(form.date)){toast("날짜를 골라주세요.");return}
      const k=form.date.slice(0,7);
      const entry={id:form.editing||uidGen(),type:form.type,amount,date:form.date,memo:form.memo.trim().slice(0,60),created:Date.now()};
      if(form.type==="out")entry.cat=form.cat;else entry.src=form.src;
      if(form.editing){
        const f=findEntry(form.editing);
        if(f){entry.created=f.e.created||entry.created;if(f.e.payKey)entry.payKey=f.e.payKey;S.months[f.k].entries.splice(f.i,1);if(f.k!==k)saveMonth(f.k)}
      }
      const beforeT=totalState(k),beforeC=entry.type==="out"?catLevel(k,entry.cat):0;
      ensureMonth(k,true).entries.push(entry);saveMonth(k);
      toast(form.editing?"수정했어요.":"저장했어요.");
      if(entry.type==="out"){
        const afterT=totalState(k),afterC=catLevel(k,entry.cat);
        const tb=beforeT?lvl(beforeT.pct):0,ta=afterT?lvl(afterT.pct):0;
        const msgs=[];let L=0;
        if(ta>0&&(ta>tb||ta===2)){msgs.push(...warningsFor(k).filter(x=>!CATS.some(([c])=>x.m.startsWith(esc(c)+" 계획"))).map(x=>x.m));L=Math.max(L,ta)}
        if(afterC>0&&(afterC>beforeC||afterC===2)){const m=warningsFor(k).find(x=>x.m.startsWith(esc(entry.cat)+" 계획"));if(m){msgs.push(m.m);L=Math.max(L,afterC)}}
        if(msgs.length)alertBox={l:L,msgs:[...new Set(msgs)]};
      }
      if(k!==view)view=k;
      resetForm();break;
    }
    case "edit":{
      const f=findEntry(ds.id);if(!f)return;
      const e=f.e;
      form={type:e.type,cat:e.cat||form.cat,src:e.src||form.src,amount:won(e.amount),date:e.date,memo:e.memo||"",editing:e.id};
      render();document.getElementById("formCard").scrollIntoView({behavior:"smooth",block:"start"});return;
    }
    case "cancelEdit":resetForm();break;
    case "del":{
      const f=findEntry(form.editing);
      if(f){S.months[f.k].entries.splice(f.i,1);saveMonth(f.k);toast("삭제했어요.")}
      resetForm();break;
    }
    case "editPlan":planDraft={...(planOf(view)||{})};render();document.getElementById("planCard")?.scrollIntoView({behavior:"smooth",block:"start"});return;
    case "cancelPlan":planDraft=null;break;
    case "savePlan":{
      const p={};for(const [c] of CATS)if(planDraft[c]>0)p[c]=planDraft[c];
      S.settings.plan=p;saveSettings();
      ensureMonth(view).plan=p;saveMonth(view);
      planDraft=null;toast("이번 달 계획을 저장했어요.");break;
    }
    /* shifts */
    case "sjob":shiftForm.job=ds.v;break;
    case "sbrk":shiftForm.brk=Number(ds.v);break;
    case "saveShift":{
      const s=shiftForm;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(s.date)){toast("날짜를 골라주세요.");return}
      if(!s.start||!s.end){toast("시작·끝 시간을 적어주세요.");return}
      if(shiftCalc(s).work<=0){toast("근무 시간이 0이에요. 시간을 확인해주세요.");return}
      if(!s.editing&&s.rep){
        const dates=repDates(s);
        if(!dates.length){toast("반복할 요일과 끝나는 날을 골라주세요.");return}
        const grp="g-"+uidGen(),touched=new Set(),have=new Set(allShifts().map(x=>x.job+"|"+x.date+"|"+x.start));
        let n=0;
        for(const d of dates){
          if(have.has(s.job+"|"+d+"|"+s.start))continue;
          const k=d.slice(0,7);{const r={id:uidGen(),job:s.job,date:d,start:s.start,end:s.end,brk:s.brk,grp};if(s.ratio!=null)r.ratio=s.ratio;ensureMonth(k).shifts.push(r);}touched.add(k);n++;
        }
        touched.forEach(saveMonth);
        toast(`근무 ${n}개를 기록했어요.`);
        resetShift();break;
      }
      const k=s.date.slice(0,7);
      const rec={id:s.editing||uidGen(),job:s.job,date:s.date,start:s.start,end:s.end,brk:s.brk};
      if(s.editing&&s.grp)rec.grp=s.grp;
      if(s.ratio!=null)rec.ratio=s.ratio;
      if(s.editing){const f=findShift(s.editing);if(f){S.months[f.k].shifts.splice(f.i,1);if(f.k!==k)saveMonth(f.k)}}
      ensureMonth(k).shifts.push(rec);saveMonth(k);
      toast(s.editing?"근무를 수정했어요.":"근무를 기록했어요.");
      if(k!==view)view=k;
      selDay=s.date;resetShift();break;
    }
    case "editShift":{
      const f=findShift(ds.id);if(!f)return;
      shiftForm={job:f.e.job,date:f.e.date,start:f.e.start,end:f.e.end,brk:f.e.brk||0,ratio:f.e.ratio??null,editing:f.e.id,grp:f.e.grp||null,rep:false,wds:[],until:""};
      render();document.getElementById("shiftCard").scrollIntoView({behavior:"smooth",block:"start"});return;
    }
    case "cancelShift":resetShift();break;
    case "selDay":selDay=ds.v;break;
    case "addOnDay":resetShift();shiftForm.date=selDay;render();document.getElementById("shiftCard").scrollIntoView({behavior:"smooth",block:"start"});return;
    case "sratio":shiftForm.ratio=ds.v===""?null:Number(ds.v);break;
    case "srep":
      shiftForm.rep=ds.v==="1";
      if(shiftForm.rep){if(!shiftForm.wds.length&&shiftForm.date)shiftForm.wds=[parseD(shiftForm.date).getDay()];if(!shiftForm.until&&shiftForm.date)shiftForm.until=fmtD(addDays(parseD(shiftForm.date),27))}
      break;
    case "swd":{const v=Number(ds.v);shiftForm.wds=shiftForm.wds.includes(v)?shiftForm.wds.filter(x=>x!==v):[...shiftForm.wds,v];break}
    case "sweeks":if(shiftForm.date)shiftForm.until=fmtD(addDays(parseD(shiftForm.date),Number(ds.v)*7-1));break;
    case "delShiftAfter":{
      const g=shiftForm.grp,from=shiftForm.date;let n=0;
      for(const k in S.months){const a=S.months[k].shifts||[];const keep=a.filter(x=>!(x.grp===g&&x.date>=from));if(keep.length!==a.length){n+=a.length-keep.length;S.months[k].shifts=keep;saveMonth(k)}}
      toast(`반복 근무 ${n}개를 삭제했어요.`);resetShift();break;
    }
    case "delShift":{
      const f=findShift(shiftForm.editing);
      if(f){S.months[f.k].shifts.splice(f.i,1);saveMonth(f.k);toast("근무 기록을 삭제했어요.")}
      resetShift();break;
    }
    case "recordPay":{
      const p=payoutsIn(view).find(x=>x.key===ds.key);if(!p)return;
      if(recordedKeys().has(p.key))return;
      const k=p.date.slice(0,7);
      ensureMonth(k,true).entries.push({id:uidGen(),type:"in",src:p.job.name,amount:p.net,date:p.date,memo:`${p.period} 알바비`,payKey:p.key,created:Date.now()});
      saveMonth(k);toast("가계부에 수입으로 기록했어요.");break;
    }
    /* job settings */
    case "newJob":jobDraft={id:"j-"+uidGen(),name:"새 알바",icon:"💼",wage:10320,ratio:100,tax:true,night:false,cycle:"month",payDay:10,payOffset:1,payWeekday:5,isNew:true};break;
    case "editJob":{const j=jobById(ds.id);if(j)jobDraft={...j};break}
    case "cancelJob":jobDraft=null;break;
    case "jRatio":jobDraft.ratio=Number(ds.v);break;
    case "jTax":jobDraft.tax=ds.v==="1";break;
    case "jNight":jobDraft.night=ds.v==="1";break;
    case "jCycle":jobDraft.cycle=ds.v;break;
    case "jOffset":jobDraft.payOffset=Number(ds.v);break;
    case "jWd":jobDraft.payWeekday=Number(ds.v);break;
    case "jWeek":jobDraft.payWeekOffset=Number(ds.v);break;
    case "saveJob":{
      const d={...jobDraft};delete d.isNew;
      d.name=(d.name||"").trim().slice(0,20);
      if(!d.name){toast("알바 이름을 적어주세요.");return}
      if(!d.wage){toast("시급을 적어주세요.");return}
      const list=jobs().map(j=>({...j}));
      const old=list.find(j=>j.id===d.id);
      if(old&&old.name!==d.name){for(const k in S.months){let ch=false;for(const e of S.months[k].entries)if(e.type==="in"&&e.src===old.name){e.src=d.name;ch=true}if(ch)saveMonth(k)}}
      const i=list.findIndex(j=>j.id===d.id);
      if(i>-1)list[i]=d;else list.push(d);
      commitJobs(list);jobDraft=null;toast("알바 설정을 저장했어요.");break;
    }
    case "delJob":{
      if(!delArm){delArm=true;break}
      commitJobs(jobs().filter(j=>j.id!==jobDraft.id).map(j=>({...j})));
      jobDraft=null;delArm=false;toast("알바를 삭제했어요.");break;
    }
  }
  render();
}


/* ---------- 한 번만 쓰는 가져오기 · 백업 ---------- */
const CANON=v=>Array.isArray(v)?`[${v.map(CANON).join(",")}]`:(v&&typeof v==="object")?`{${Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+CANON(v[k])).join(",")}}`:JSON.stringify(v);
const isEmptyDoc=()=>!Object.keys(S.months||{}).length&&!(S.settings&&S.settings.wallet);
function clearHash(){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}
function applyDoc(obj,silent){
  if(!obj||typeof obj!=="object")return false;
  if(!obj.months&&!obj.settings)return false;
  const doc={settings:obj.settings||{},months:{}};
  for(const k in (obj.months||{}))doc.months[k]=normMonth(obj.months[k]);
  try{
    const ex=localStorage.getItem(LS_KEY);
    if(ex){
      let same=false;
      try{same=CANON(JSON.parse(ex))===CANON(doc)}catch(e){}
      if(!same&&!silent&&!window.confirm("이 브라우저에 이미 가계부 기록이 있어요. 불러오면 지금 기록이 이 내용으로 바뀌어요. 계속할까요?"))return false;
    }
    localStorage.setItem(LS_KEY,JSON.stringify(doc));
    return true;
  }catch(e){toast("이 브라우저에서는 저장이 안 돼요.");return false}
}
function importFromHash(){
  const m=/import=([^&#]+)/.exec(location.hash||"");
  if(!m)return;
  let obj=null;
  try{
    let b64=m[1].replace(/-/g,"+").replace(/_/g,"/");
    b64+= "=".repeat((4-(b64.length%4||4))%4);
    const bin=atob(b64),by=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);
    obj=JSON.parse(new TextDecoder("utf-8").decode(by));
  }catch(e){obj=null}
  clearHash();
  if(!obj)return;
  if(applyDoc(obj))setTimeout(()=>toast("가계부 기록을 불러왔어요."),400);
}
window.addEventListener("hashchange",()=>importFromHash());
function backupHTML(){
  if(mode==="loading")return "";
  const empty=isEmptyDoc();
  return `<section class="card" style="margin-bottom:18px">
    <h2>백업 ${empty?"· 불러오기":""}</h2>
    <p class="lab" style="margin:0 0 10px">${empty?"아직 기록이 없어요. 백업 파일이나 불러오기 링크로 그 내용을 채울 수 있어요.":"기록은 이 기기 브라우저에만 저장돼요. 파일로 내보내 두면 폰을 바꾸거나 기록이 지워져도 되살릴 수 있어요."}</p>
    <div class="actions">
      <button class="ghost" data-act="exportJson">백업 내보내기</button>
      <button class="ghost" data-act="pickImport">백업 가져오기</button>
    </div>
    <input type="file" id="impFile" accept=".json,application/json" style="display:none" aria-hidden="true">
  </section>`;
}

importFromHash();
boot();
})();
